[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hath0r-engine"
version = "1.0.0"
description = "HATH0R Engine — Tri-Graph cognitive substrate and execution safety layer for the HATHOR agentic framework."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Bayly AI" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "jsonschema>=4.0",
  "mypy>=1.0",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/Bayly-AI/HATH0R-Agentic-Framework"
Documentation = "https://github.com/Bayly-AI/HATH0R-Agentic-Framework/tree/development/docs"
Repository = "https://github.com/Bayly-AI/HATH0R-Agentic-Framework"
Issues = "https://github.com/Bayly-AI/HATH0R-Agentic-Framework/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hath0r_engine = ["py.typed", "jev/jev.json", "schemas/*.json"]

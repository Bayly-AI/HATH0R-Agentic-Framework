schema_version: "hath0r.iac.spec/1"
service_name: "hath0r-framework"
container:
  tech_stack: "python"
  base_image: "python:3.11-slim"
  multi_stage: true
  non_root_user:
    uid: 10001
    gid: 10001
    username: "hath0r"
  healthcheck:
    enabled: true
    interval_seconds: 30
    timeout_seconds: 5
    retries: 3
  read_only_root_filesystem: true
salting:
  digest_pinning: true
  sha256_digest: "sha256:448e5d56f090901443e89999fc77217a8feecc82e5dbd71e676a4ca4ec2d06bc"
  signature_provider: "cosign"
  attestation_format: "slsa-provenance-v1"
  secret_salting_provider: "aws_secrets_manager"
deployment:
  target_platform: "aws_eks_fargate"
  cluster_name: "hath0r-eks-cluster"
  namespace: "hath0r-framework"
  fargate_profile: "hath0r-hath0r-framework-profile"
  replicas: 2
  resources:
    cpu_request: "250m"
    cpu_limit: "500m"
    memory_request: "512Mi"
    memory_limit: "1Gi"
  ingress:
    alb_scheme: "internet-facing"
    target_type: "ip"
  irsa_iam_role_arn: "arn:aws:iam::711387127111:role/hath0r-hath0r-framework-irsa"
